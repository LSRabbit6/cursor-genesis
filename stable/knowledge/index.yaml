# cursor-genesis 知识索引——叶子入口
# kg 经本文件读 cg（kg meta/leaf-node-spec-v2.md §2.5：kg 引用叶子只到节点级，要指件写本文件条目的锚，
# 例 cursor-genesis:stable/knowledge/index.yaml#state-header）。件搬走了改这里，kg 不跟着动。
# 2026-10-22 重写：知识体系、架构决策、Cursor 规范、提示词四类历史文档已归档到 archive/2026-10-22/
# （kg 都提炼过；knowledge-system 在 kg meta/archives/知识体系整理/ 有逐行对齐的副本）。现有内容各进哪个包见仓根 INVENTORY.md。

domain: ai-collaboration-method
description: 讲明白的体系怎么结合到各家 harness 上去；单位是结合包（按使用方分，宿主是包里一层）。本文件列结合包、货架包和还在用的件

# 知识分类
categories:
  bundles:
    description: 结合包清单（按使用方分；四层：组件层、宿主适配层、自装层、清单）
    path: ../../bundles/
    items:
      - id: bundles
        title: 结合包总说明（四层、进包的门、清单怎么写）
        file: ../../bundles/README.md
        solves: 解决「cg 装什么、按什么单位交出去」——一个包四层，按使用方分，宿主是包里一层
      - id: bundle-workbench
        title: 工作台包（交给真人专家，由对方 AI 自装）
        file: ../../bundles/workbench/bundle.yaml
        solves: 解决把专家工作台交给对方、让对方电脑上的 AI 照说明装好并现场验收
      - id: bundle-delivery
        title: 交付包（会用 harness、没做过产品设计的外部使用者）
        file: ../../bundles/delivery/bundle.yaml
        solves: 解决把规范、检查器、要方案入口一次交给外部 harness 使用者
      - id: bundle-self
        title: 自用包（维护者自己的另一台机器，占位）
        file: ../../bundles/self/bundle.yaml
        solves: 另一台机器真要装时的位置

  collaboration-mechanisms:
    description: 工具无关的人—Agent 操作与纠错机制
    path: ../atoms/
    items:
      - id: harvest-session
        title: 会话成果收割
        file: ../atoms/skills/harvest-session/SKILL.md
        solves: 解决会话结束时聊天纪要、项目状态、定位 why、跨项目提炼候选和环境约定混在一起的问题；按证据分诊并明确负空间
        keywords:
          - session-harvest
          - handoff
          - session-summary
          - decision-trace
          - process-material
      - id: state-header
        title: 真相源状态头契约与鲜活度裁判
        file: ../atoms/validators/state-header/CONTRACT.md
        solves: 解决工作台真相源文件「写着在做、其实早停了」的死存根问题；状态头契约 + stdlib 验证器，第一个消费方是维护者的工作台书桌
        keywords:
          - state-header
          - validator
          - 死存根

  workbench-candidates:
    description: 工作台包的候选件（已随一位科研工作者的工作台发出过，见 bundles/workbench/bundle.yaml candidates）
    path: ../atoms/
    items:
      - id: capabilities
        title: 四层原子角色能力（20 个 capability 提示词）
        file: ../atoms/capabilities/
        solves: 课题拆解、研究框架、检索、实验设计、执行等角色提示词，按名选用
      - id: topic-research-team
        title: 课题研究团队流程
        file: ../atoms/patterns/topic-research-team.md
        solves: 科研五角色顺序协作的流程
      - id: strategic-research-team
        title: 战略研判团队流程
        file: ../atoms/patterns/strategic-research-team.md
        solves: 商业技术 Go/No-Go 研判的流程

  shelf:
    description: 货架上的其他包（自用包候选）
    path: ../packs/
    items:
      - id: create-toolkit
        title: Create Toolkit 资产创建工具箱
        file: ../packs/create-toolkit/README.md
        solves: 解决如何创建工具无关 Skill、Agent Contract、Command Contract 与 AGENTS.md Rule Contract，并用公共 rubric 做证据化审计
      - id: deep-research
        title: Deep Research 系统化调研
        file: ../packs/deep-research/README.md
        solves: 解决如何将模糊的调研需求转化为结构化的研究报告，提供 Plan→Execute→Synthesize 三阶段流程

  learnings:
    description: 经验沉淀（2025-12、2026-02 那几篇已归档；企业交付那篇跟 enterprise 走，尚未提炼）
    path: learnings/
    items:
      - id: offline-onsite-integration-debugging
        title: 离线现场联调排障（企业交付）
        file: learnings/2026-06-offline-onsite-integration-debugging.md
        solves: 企业项目离线现场联调时的排障经验

  engineering-practices:
    description: 工程实践方法论（语言/框架级可复用约束与运维经验）
    path: ../atoms/skills/  # 实际承载于 atoms 层 SKILL.md，本 category 仅作上层检索入口
    items:
      - id: java-backend-test-ops
        title: Java 后端测试运维方法论
        file: ../atoms/skills/java-backend-test-ops/SKILL.md
        solves: 解决 Java + Spring Boot 3.x + Testcontainers 项目中的两类高频痛点——Testcontainers 留守容器累积导致 InnoDB EAGAIN（AIO 槽位耗尽），以及 Spring Boot 3.x MockMvc API @NonNull 注解带来的 null-safety 告警扩散；附带共享测试基类变更传播规则
        keywords:
          - testcontainers
          - spring-boot
          - mysql
          - docker
          - java
          - maven
          - mockmvc
          - eagain
          - null-safety

  # 2026-08-12 kg 跨仓迁移波接收：harness-engineering pack（skill 形态，双宿主原生发现；
  # 判断内核全部留 kg 判断层，此处登记的是可执行操作面——供 kg 直读收割契约发现）
  harness-engineering:
    description: Harness 工程与 agent 记忆约束的可执行资产（pack 形态，正本在 stable/packs/）
    path: ../packs/harness-engineering/
    items:
      - id: agent-memory-harness-blueprint
        title: Agent 记忆 harness 约束蓝图（33 条 + 取件入口）
        file: skills/agent-memory-harness-blueprint/blueprint.md
        solves: 给不带上下文的新会话/自研 harness 壳子提供可直接消费的 agent 记忆约束集（准入/存储/运行/代谢五章），配 export.py 取件验鲜
      - id: harness-engineering-fieldbook
        title: Harness Engineering 实战规程手册
        file: skills/harness-engineering-fieldbook/SKILL.md
        solves: 解决远程依赖重的项目（Java 微服务等）如何改造为 AI 可本地闭环验证的环境（最小可运行子集/脚本化/分层验证/JVM 诊断 CLI 化）
      - id: cross-host-thin-adapters
        title: 三宿主跨宿主兼容层清单
        file: skills/cross-host-thin-adapters/SKILL.md
        solves: 解决一份资产喂 Cursor/Claude Code/Codex 三宿主时哪些能统一（作者层）哪些永不统一（薄适配层）的现行法清单与验收状态
      - id: structured-output-dispatch
        title: 结构化表达 L3 调度规则
        file: skills/structured-output-dispatch/SKILL.md
        solves: 解决按内容目标与受众类型选表达方法论骨架的调度问题（10 类 goal 映射 + 4 类受众适配 + 五步流程）
      - id: sse-stream-parsing
        title: SSE 流式解析 carry buffer 规程
        file: skills/sse-stream-parsing/SKILL.md
        solves: 解决 SSE/NDJSON 流按行分割的跨缓冲区残行解析失败与协议数据泄漏问题

  # 2026-09-24 补登：delivery-data-app 09-23 入库时只写了 CHANGELOG / 根 README，没进本索引与资源目录（kg 侧更新子模块时发现）
  delivery-data-app:
    description: 业务交付 · 数据应用——给会用 harness 但不懂产品设计的人：产物规范 7 条 + 信息架构规范 4 条 + 机器检查器 + 设计稿六段模板（发布态，查表即用；0.2.0 起领域清单入口拆成 domain-menu 包）
    path: ../packs/delivery-data-app/
    items:
      - id: delivery-data-app
        title: 业务交付 · 数据应用套装入口（装法 / 到场 / 用法 / 回流）
        file: README.md
        solves: 解决「harness 能把东西做出来，但站产品设计角度有很大优化空间」——把规范、检查器、设计稿模板一次装进 .agents/
        keywords:
          - 数据应用
          - 产品规范
          - 信息架构
          - delivery
          - data-app
      - id: data-app-norms
        title: 产物规范 7 条 + 信息架构规范 4 条
        file: rules/data-app-norms.md
        solves: 收工前该查什么——charset / viewport / 外部依赖 / 长列表无检索等 4 条机器查，其余人判
        keywords:
          - 规范
          - norms
          - charset
          - viewport
      - id: data-app-norms-check
        title: 检查器（stdlib-only；Stop hook 或手动跑）
        file: validators/data-app-norms-check/CONTRACT.md
        solves: 改过的 HTML 收工时自动扫，不过就拦一次并说清哪条没过
        keywords:
          - validator
          - 检查器
          - Stop hook
      - id: design-doc-six-sections
        title: 设计稿六段模板（验收 / 不变量必填）
        file: plan-templates/design-doc-six-sections.md
        solves: 让 harness 动手前先写六段，验收条带能跑的命令
        keywords:
          - 设计稿
          - 六段
          - 验收

  # 2026-09-24 从 delivery-data-app 拆出单立：菜单服务的客户端（用户点名「起服务、域名暴露，对方 skill 要方案时调一下」）
  domain-menu:
    description: 要方案的入口——菜单服务的客户端：拿自查清单、在本仓自查后交回类型、按返回装包贴设定、查登记进度、报不合身（stdlib-only）
    path: ../packs/domain-menu/
    items:
      - id: domain-menu
        title: 要方案入口（装法 / 协议表 / 一次典型的活）
        file: README.md
        solves: 解决「对方的 harness 不知道我们有什么、有了也拿不到、没有也报不回来」——自查清单在对方家答，服务只查表回包或登记
        keywords:
          - 领域
          - domain-menu
          - 菜单服务
          - 自查清单
          - 材料清单
      - id: domain-menu-skill
        title: domain-menu skill（五步要方案 + 反馈 + 断网补交）
        file: skills/domain-menu/SKILL.md
        solves: 「选领域 / 要方案」时照五步走：checklist → 自查 → submit → install 或拿编号 → status

  # 2026-09-24 复利第二环打包接收：toys 工作台当夜落地的「第二个环」运行件的模板原件（框架 + 模板 + 调用说明）；
  # 判断内核留 kg、人的数据只住各人目录的线文件——此处登记的是可加载的操作面
  second-loop-compounding:
    description: 复利第二环——一件事干完之后怎么复盘、提炼、归位、在下一件开场时到场，以及「环转没转」的读数口（pack 形态，正本在 stable/packs/）
    path: ../packs/second-loop-compounding/
    items:
      - id: second-loop-compounding
        title: 复利第二环套装入口（怎么加载 + 与运行件对应表）
        file: README.md
        solves: 解决「干完的事下次怎么用上、凭什么不白干」在新会话或新项目里无处加载的问题；三步加载（读 README → A 模板复盘 → LINE 模板接人际线）+ 模板原件与 toys 运行件的对应表
        keywords:
          - 复利
          - 第二环
          - compounding
          - second-loop
          - 复盘
      - id: second-loop-framework
        title: 复利第二环框架摘要
        file: docs/framework.md
        solves: 解决把复利误并进任务验收、四类沉淀混成一锅的问题；第二个环五步、四线（认知 / 资产 / 元运维 / 人际）× 三定义（类型 / 提炼方式 / 用途）、两本账、顺序铁律、六块探针、三种活分开跑、交接契约要点、松耦合原则
      - id: compounding-a-sample-template
        title: 复利样本 A 模板（一页复盘）
        file: templates/A-sample.md
        solves: 解决一件事干完后复盘写厚写散、只写期待没有读数的问题；八问 + 负空间一页：四线提炼、取用账与线上账、探针读数、回填框架缺口、跨线流动
      - id: person-line-template
        title: 人际线 LINE.md 模板（每人一份）
        file: templates/LINE.md
        solves: 解决对一个人的理解散在会话与记忆长文里、跨会话接不上的问题；九节固定结构（原话 / 四层理解 / 阶段 / 学到分享共同经历 / 两条链带归属 / 三格探针 / 命盘参考层 / 下一次上场 / 负空间），宫当坐标不当预测
      - id: claude-codex-content-handoff
        title: Claude → Codex 内容交接包与回执模板
        file: templates/content-handoff.md
        solves: 解决 Claude 出内容、Codex 出表达时口头派单、内容口径被改、推翻不说、只读回执就验收的问题；交接包九个必有节 + 回执五节（templates/codex-receipt.md）
      - id: design-in-use-criteria
        title: 设计在用与否判据（七态 + 第八态 unspecced）
        file: docs/in-use-criteria.md
        solves: 解决分不清一个设计、机制或探针是真在用还是只登记过、在跑没人看、休眠的问题；四类证据 + 七态 + 四对区分，外加第八态 unspecced；七态已由观察器机器判
      - id: compounding-probes-howto
        title: 复利探针与休眠脚本调用说明
        file: docs/probes-howto.md
        solves: 解决探针读数（记忆召回对账、路由对账、判断层取用、判据台账标龄）与休眠摘出在哪跑、读写哪、失败怎么叫人不清楚的问题；toys 运行件的调用、干跑与移植约定

