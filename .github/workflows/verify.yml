name: Verify CG
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.17.1"
      - run: pnpm install --frozen-lockfile
      - name: Verify source, migrations, permissions, recovery and UI
        env:
          CG_VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm verify
      - name: Build standalone container after verification
        run: docker build --build-arg CG_SOURCE_COMMIT="$GITHUB_SHA" -t cg-verified .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: dist/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-workbench
          path: |
            dist/
            service/
            drizzle/
            scripts/backup.py
            scripts/init-access.mjs
            package.json
          retention-days: 14
