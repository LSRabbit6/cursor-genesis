    model_tier: 笼内 claude-fable-5-1（xhigh），主控 claude-opus-5-5
    host: [claude-code]
    project: cursor-genesis
    date: 2026-10-28
    reading: 10-17 toys 审计场实测锁住目录、工具剩五个、接续加挂目录可用；10-28 在 Claude Code 2.1.299 复测读笼外被拒；核对脚本对 10-17 一阶段的判定与 toys 原脚本一致
    source: cursor-genesis:bundles/self/adapters/claude-code/README.md#读数
